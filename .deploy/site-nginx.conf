# Inside the web container. TLS, HSTS and rate limiting are handled one hop up
# by the edge nginx — this block serves the React build and forwards the API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Docker's embedded DNS, resolved per request: if the api container is
    # restarting, /api answers 502 instead of nginx refusing to start.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $demo_api "site-congress-demo-api:9101";

    location /api/ {
        proxy_pass         http://$demo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side router: /demo, /patterns, /tickers ... all resolve to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
