# congress-demo — the public demo of the Congressional Disclosure Tracker.
#
# Two containers, one hostname. The edge proxies congress.demos.noeinsolutions.com
# to `web` only; `web` serves the React build and hands /api/* to `api`. `api`
# sits on an internal network with no route out, so the demo can make no
# outbound call even by accident — the snapshot is all it has.
#
# Secrets come from /opt/sites/congress-demo/.env (0600, root-owned, never in git):
# only APP_SESSION_SECRET. Everything else below is published on purpose.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: site-congress-demo-web:${SITE_TAG:-latest}
    container_name: site-congress-demo-web
    volumes:
      - ./site-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
      - internal
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: site-congress-demo-api:${SITE_TAG:-latest}
    container_name: site-congress-demo-api
    env_file:
      - .env
    environment:
      # The kill switch. Off, and the mint route 404s, the read-only guard
      # stands down and the banner disappears — so the database path below is
      # equally explicit: this container has no live database to fall back to.
      DEMO_MODE: "1"
      DEMO_USERNAME: demo
      DEMO_PASSWORD: demo
      DEMO_SOURCE_URL: https://noeinsolutions.com/builds.html
      CONGRESS_DB_PATH: /app/data/db/demo-snapshot.sqlite
      # The login gate a visitor arriving at / meets. Published credentials.
      APP_USERNAME: demo
      APP_PASSWORD: demo
      APP_SESSION_COOKIE: f9_demo_session
      APP_SESSION_HTTPS_ONLY: "1"
      API_SERVER_ADDRESS: 0.0.0.0
      API_SERVER_PORT: "9101"
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      # The 42 MB snapshot is expanded here at every start. SQLite needs a
      # writable directory for its WAL files even though no write is accepted.
      - /app/data/db:size=128m,mode=1777
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9101/api/demo/status', timeout=5).status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
  internal:
    internal: true
