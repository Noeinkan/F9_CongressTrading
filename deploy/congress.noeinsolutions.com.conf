# congress.noeinsolutions.com — the live board, behind the shared nginx edge.
#
# Install on the server as /opt/sites/_vhosts/congress.conf, which is mounted
# into the nginx container at /etc/nginx/conf.d/sites/ and picked up by the
# wildcard include in /opt/sites/_edge/00-sites.conf.
#
# Unlike asterbloom / fractal / voxelcity, this app is NOT a container: it runs
# on the host as the congress-api (uvicorn, 127.0.0.1:9001) and congress-web
# (Caddy, *:8080) systemd units. Caddy already serves frontend/dist and proxies
# /api/* to the API, so nginx's whole job here is TLS plus a proxy to the host.
# 172.17.0.1 is the docker0 gateway — the host as seen from inside the nginx
# container. Verified reachable from bep-generator-nginx-1 on 2026-09-12.
#
# Before installing this file, the certificate must exist, or `nginx -t` fails
# on the missing ssl_certificate path and the whole edge refuses to reload.
# Use deploy/congress.noeinsolutions.com.bootstrap.conf first — see deploy/README.md.

# HTTP — ACME challenge only, everything else redirected to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name congress.noeinsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — terminates TLS, proxies to the host Caddy on :8080.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name congress.noeinsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/congress.noeinsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/congress.noeinsolutions.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # CSV exports stream from the API; give them room.
    client_max_body_size 4m;

    # Held in a variable so the http-level resolver defers name resolution to
    # request time: a stopped congress-web returns 502 for this hostname only,
    # and can never stop nginx from starting.
    set $upstream_congress "172.17.0.1:8080";
    location / {
        proxy_pass         http://$upstream_congress;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app marks its session cookie Secure off APP_SESSION_HTTPS_ONLY,
        # but anything downstream that checks the scheme needs this to be true.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # Some analytics pages aggregate over the full transaction table.
        proxy_read_timeout 120s;
    }

    # Never serve dotfiles (.git, .env, editor leftovers) even by accident.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
