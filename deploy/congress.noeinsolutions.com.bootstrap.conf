# congress.noeinsolutions.com — bootstrap vhost, used ONCE to get a certificate.
#
# The real vhost references /etc/letsencrypt/live/congress.noeinsolutions.com/,
# which does not exist yet. nginx refuses to start with a missing certificate
# path, so installing the real vhost first would break the whole edge — every
# other site on the box included.
#
# So: install this, reload, run certbot over HTTP-01, then replace it with
# congress.noeinsolutions.com.conf and reload again. It serves nothing but the
# ACME challenge.

server {
    listen 80;
    listen [::]:80;
    server_name congress.noeinsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
